<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Colección Musical</title>
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #ffffff; padding-bottom: 80px; }
    header { background: #1e1e1e; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: #1db954; }
    .tabs { display: flex; background: #181818; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; z-index: 10; }
    .tab { flex: 1; padding: 14px; text-align: center; color: #aaa; font-weight: bold; font-size: 0.9rem; border: none; background: none; }
    .tab.active { color: #1db954; border-top: 2px solid #1db954; }
    .section { display: none; padding: 16px; }
    .section.active { display: block; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 1rem; }
    input { flex: 1; }
    button.primary { background: #1db954; color: #000; font-weight: bold; border: none; }
    button.danger { background: #e53935; color: #fff; border: none; padding: 8px 12px; font-size: 0.85rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; border: 1px solid #2c2c2c; display: flex; flex-direction: column; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #2a2a2a; }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
    .card-artist { font-size: 0.85rem; color: #bbb; margin-bottom: 6px; }
    .badge { display: inline-block; background: #333; color: #1db954; font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; width: fit-content; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 20; overflow-y: auto; padding: 20px; }
    .modal-content { background: #1e1e1e; border-radius: 12px; padding: 16px; max-width: 500px; margin: auto; }
    .tracklist { margin-top: 12px; list-style: none; border-top: 1px solid #333; }
    .tracklist li { padding: 8px 0; border-bottom: 1px solid #2a2a2a; font-size: 0.9rem; color: #ddd; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .alert { padding: 14px; border-radius: 8px; margin-top: 12px; font-weight: bold; text-align: center; }
    .alert-yes { background: #1b5e20; color: #a5d6a7; }
    .alert-no { background: #b71c1c; color: #ffcdd2; }
  </style>
</head>
<body>

<header>
  <h1>🎵 Mi Colección</h1>
  <span id="total-count" style="font-size:0.9rem; color:#aaa;">0 discos</span>
</header>

<!-- SECCIÓN 1: BIBLIOTECA -->
<div id="sec-library" class="section active">
  <div class="search-box">
    <input type="text" id="filter-input" placeholder="Filtrar mi colección..." oninput="renderLibrary()">
    <select id="filter-format" onchange="renderLibrary()">
      <option value="Todos">Todos</option>
      <option value="Vinilo">Vinilo</option>
      <option value="CD">CD</option>
      <option value="Cassette">Cassette</option>
      <option value="Digital">Digital</option>
    </select>
  </div>
  <div id="library-grid" class="grid"></div>
</div>

<!-- SECCIÓN 2: AGREGAR DISCO -->
<div id="sec-add" class="section">
  <div class="search-box">
    <input type="text" id="search-query" placeholder="Artista o nombre del álbum...">
    <button class="primary" onclick="searchMusic()">Buscar</button>
  </div>
  <div id="search-results" class="grid"></div>
</div>

<!-- SECCIÓN 3: ESCÁNER CÁMARA -->
<div id="sec-scan" class="section">
  <p style="margin-bottom:10px; color:#ccc;">Escanea el código de barras del disco para comprobar si ya lo tienes:</p>
  <button class="primary" style="width:100%;" onclick="startScanner()">📷 Activar Cámara</button>
  <div id="reader"></div>
  <div id="scan-result"></div>
</div>

<!-- MODAL DETALLES Y CANCIONES -->
<div id="album-modal" class="modal">
  <div class="modal-content" id="modal-body"></div>
</div>

<!-- NAVEGACIÓN INFERIOR -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('library', this)">📚 Biblioteca</button>
  <button class="tab" onclick="switchTab('add', this)">➕ Agregar</button>
  <button class="tab" onclick="switchTab('scan', this)">📷 Escáner</button>
</div>

<script>
  let collection = JSON.parse(localStorage.getItem('musicCollection') || '[]');
  let html5QrCode = null;
  const API_BASE = 'https://musicbrainz.org' + '/ws/2/release/';
  const COVER_BASE = 'https://coverartarchive.org' + '/release/';
  const fallbackImg = 'https://placeholder.com';

  function saveCollection() {
    localStorage.setItem('musicCollection', JSON.stringify(collection));
    renderLibrary();
  }

  function switchTab(tabName, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('sec-' + tabName).classList.add('active');
    btn.classList.add('active');
    if (tabName !== 'scan' && html5QrCode) {
      html5QrCode.stop().catch(() => {});
    }
  }

  function renderLibrary() {
    const grid = document.getElementById('library-grid');
    const q = document.getElementById('filter-input').value.toLowerCase();
    const fmt = document.getElementById('filter-format').value;
    document.getElementById('total-count').innerText = collection.length + ' discos';

    const filtered = collection.filter(item => {
      const matchText = item.title.toLowerCase().includes(q) || item.artist.toLowerCase().includes(q);
      const matchFmt = fmt === 'Todos' || item.format === fmt;
      return matchText && matchFmt;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#777; margin-top:30px;">No hay discos aquí todavía.</p>';
      return;
    }

    grid.innerHTML = filtered.map(item => `
      <div class="card" onclick="openAlbumDetails('${item.id}', true)">
        <img src="${item.cover}" onerror="this.src='${fallbackImg}'">
        <div class="card-body">
          <div>
            <div class="card-title">${item.title}</div>
            <div class="card-artist">${item.artist}</div>
          </div>
          <span class="badge">${item.format}</span>
        </div>
      </div>
    `).join('');
  }

  async function searchMusic(barcode = null) {
    const query = barcode ? 'barcode:' + barcode : document.getElementById('search-query').value.trim();
    if (!query) return;
    const resultsDiv = document.getElementById('search-results');
    if (!barcode) resultsDiv.innerHTML = '<p style="grid-column:1/-1;">Buscando en base de datos...</p>';

    try {
      const url = API_BASE + '?query=' + encodeURIComponent(query) + '&fmt=json&limit=12';
      const res = await fetch(url, {
        headers: { 'User-Agent': 'MiColeccionMusicaApp/1.0' }
      });
      const data = await res.json();
      const releases = data.releases || [];

      if (barcode) return releases;

      if (releases.length === 0) {
        resultsDiv.innerHTML = '<p style="grid-column:1/-1;">No se encontraron resultados.</p>';
        return;
      }

      resultsDiv.innerHTML = releases.map(rel => {
        const artistCredit = rel['artist-credit'];
        const artist = (artistCredit && artistCredit.at(0)) ? artistCredit.at(0).name : 'Artista desconocido';
        const cover = COVER_BASE + rel.id + '/front-250';
        const format = (rel.media && rel.media.at(0) && rel.media.at(0).format) ? rel.media.at(0).format : 'CD';
        const safeArtist = artist.replace(/'/g, "\\'");
        const safeTitle = rel.title.replace(/'/g, "\\'");
        return `
          <div class="card" onclick="openAlbumDetails('${rel.id}', false, '${safeArtist}', '${safeTitle}', '${format}', '${rel.barcode || ''}')">
            <img src="${cover}" onerror="this.src='${fallbackImg}'">
            <div class="card-body">
              <div>
                <div class="card-title">${rel.title}</div>
                <div class="card-artist">${artist}</div>
              </div>
              <span class="badge">${format}</span>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      if (!barcode) resultsDiv.innerHTML = '<p style="grid-column:1/-1;">Error de conexión. Intenta de nuevo.</p>';
    }
  }

  async function openAlbumDetails(id, isSaved, artist = '', title = '', defaultFormat = 'CD', barcode = '') {
    const modal = document.getElementById('album-modal');
    const body = document.getElementById('modal-body');
    modal.style.display = 'block';
    body.innerHTML = '<p>Cargando lista de canciones...</p>';

    if (isSaved) {
      const album = collection.find(a => a.id === id);
      body.innerHTML = `
        <img src="${album.cover}" onerror="this.src='${fallbackImg}'" style="width:100%; border-radius:8px; margin-bottom:12px;">
        <h2>${album.title}</h2>
        <p style="color:#bbb; margin-bottom:8px;">${album.artist} • <strong>${album.format}</strong></p>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <button class="danger" onclick="removeAlbum('${album.id}')">🗑️ Eliminar de colección</button>
          <button onclick="closeModal()">Cerrar</button>
        </div>
